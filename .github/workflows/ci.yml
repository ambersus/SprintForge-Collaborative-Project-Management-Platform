name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: sprintforge, POSTGRES_USER: sprintforge, POSTGRES_PASSWORD: sprintforge}
        options: >-\
          --health-cmd "pg_isready -U sprintforge" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7
        options: >-\
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]
    defaults: {run: {working-directory: backend}}
    env: {POSTGRES_HOST: localhost, POSTGRES_PORT: 5432, POSTGRES_DB: sprintforge, POSTGRES_USER: sprintforge, POSTGRES_PASSWORD: sprintforge, REDIS_URL: redis://localhost:6379/0, DJANGO_SECRET_KEY: ci-only-secret}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run test
      - run: npm run build
