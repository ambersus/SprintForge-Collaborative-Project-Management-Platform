name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sprintforge
          POSTGRES_USER: sprintforge
          POSTGRES_PASSWORD: sprintforge
        options: >-
          --health-cmd "pg_isready -U sprintforge"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sprintforge
      POSTGRES_USER: sprintforge
      POSTGRES_PASSWORD: sprintforge
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: pytest -v

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Vitest tests
        run: npm run test
      - name: Production build (validates TypeScript + Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api
          NEXT_PUBLIC_WS_URL: wss://api.example.com

  # ── Docker build validation ───────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx (multi-platform support)
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com/api
            NEXT_PUBLIC_WS_URL=wss://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
